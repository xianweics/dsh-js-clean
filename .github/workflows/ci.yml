name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: bundle manifest
        run: node -e "const p=require('./package.json');if(!p.dsh?.bundle?.patch)throw new Error('package.json must declare dsh.bundle.patch');console.log('dsh.bundle ->',p.dsh.bundle.patch)"
      - name: pack contents
        run: pnpm pack --dry-run
